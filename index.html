<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nebula</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02030a; cursor: none; }
  canvas { cursor: none; position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .fallback { position: fixed; inset: 0; display: none; place-items: center; color: #7fdcd2; font: 14px/1.5 sans-serif; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="fallback" id="fb">이 브라우저는 WebGL을 지원하지 않습니다.</div>
<script>
(function () {
  var canvas = document.getElementById('c');
  var gl = canvas.getContext('webgl', { antialias: false, alpha: false });
  if (!gl) { document.getElementById('fb').style.display = 'grid'; return; }

  var small = Math.min(innerWidth, innerHeight) < 600 || matchMedia('(pointer:coarse)').matches;
  var N = small ? 34000 : 46000;                       // 30,000 ~ 60,000 범위

  var VS = [
    'attribute vec3 a_pos; attribute vec4 a_seed;',
    'uniform float u_t; uniform vec2 u_mouse; uniform float u_mp; uniform vec2 u_scale; uniform float u_dpr;',
    'uniform float u_zoom; uniform vec2 u_pan; uniform mat3 u_rot;',
    'varying vec3 v_col; varying float v_a;',
    'void main(){',
    '  float w = 6.2831853 / 10.0;',                    // 10초 호흡
    '  float ph = a_seed.x * 6.2831853;',
    '  vec3 p = a_pos; float r = length(p.xy);',
    '  float ang = u_t * 0.012 / (0.4 + r);',
    '  p.xy = mat2(cos(ang), -sin(ang), sin(ang), cos(ang)) * p.xy;',
    '  float br = sin(w * u_t + ph);',
    '  p *= 1.0 + 0.025 * br;',
    '  p.xy += 0.012 * vec2(sin(w * u_t * 0.5 + ph * 1.7), cos(w * u_t * 0.5 + ph));',
    '  p = u_rot * p;',                                  // 360° 회전
    '  float s = 1.0 / (1.0 - p.z * 0.25);',             // 약한 원근
    '  vec2 q = p.xy * s;',
    '  vec2 base = q * u_scale * u_zoom + u_pan;',
    '  vec2 d = (base - u_mouse) / u_scale;',
    '  float rad = 0.16 * u_zoom;',
    '  float f = exp(-dot(d, d) / (rad * rad)) * u_mp;', // 포인터 근처만 약하게
    '  vec2 disp = (normalize(d + 1e-4) * 0.05 * u_zoom + vec2(-d.y, d.x) * 0.25) * f;',
    '  gl_Position = vec4(base + disp * u_scale, 0.0, 1.0);',
    '  gl_PointSize = a_seed.y * u_dpr * sqrt(u_zoom) * s * (1.0 + 0.25 * br) * (1.0 + f * 0.4);',
    '  vec3 teal = vec3(0.22, 1.0, 0.92); vec3 red = vec3(1.0, 0.30, 0.34);',
    '  v_col = mix(teal, red, a_seed.z) * a_seed.w;',
    '  v_a = 0.22 * (0.85 + 0.15 * br) * clamp(s, 0.7, 1.25);',
    '}'
  ].join('\n');

  var FS = [
    'precision mediump float;',
    'varying vec3 v_col; varying float v_a;',
    'void main(){',
    '  float d = length(gl_PointCoord - 0.5) * 2.0;',
    '  float a = exp(-d * d * 4.5) * smoothstep(1.0, 0.85, d);',
    '  gl_FragColor = vec4(v_col, a * v_a);',
    '}'
  ].join('\n');

  function sh(type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  var prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);

  // ---- 입자: 나선팔 + 확산 구름, 중심부 비움, 약간의 두께(z) ----
  function g() { return (Math.random() + Math.random() + Math.random() - 1.5) * 2; }
  var pos = new Float32Array(N * 3), seed = new Float32Array(N * 4);
  for (var i = 0; i < N; i++) {
    var r, th, arm = Math.random() < 0.8;
    if (arm) {
      var k = Math.floor(Math.random() * 3), t = Math.pow(Math.random(), 0.85);
      r = 0.22 + t * 0.66 + g() * 0.024;
      th = k * 2.0944 + r * 3.4 + g() * (0.13 + 0.24 * t);
    } else {
      r = 0.25 + Math.pow(Math.random(), 0.9) * 0.63;
      th = Math.random() * 6.2832;
    }
    r = Math.min(Math.max(r, 0.2), 0.9);
    pos[i * 3] = Math.cos(th) * r;
    pos[i * 3 + 1] = Math.sin(th) * r * 0.92;
    pos[i * 3 + 2] = g() * (arm ? 0.07 : 0.14) * (0.5 + r);
    var c = 0.5 + 0.5 * Math.sin(th + r * 2.4) + (Math.random() - 0.5) * 0.35;
    c = Math.min(Math.max((c - 0.38) / 0.24, 0), 1); c = c * c * (3 - 2 * c);
    seed[i * 4] = Math.random();
    seed[i * 4 + 1] = 1.3 + Math.pow(Math.random(), 3) * 2.4;
    seed[i * 4 + 2] = c;
    seed[i * 4 + 3] = 0.8 + Math.random() * 0.2;
  }
  function attr(name, data, size) {
    var b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    var l = gl.getAttribLocation(prog, name);
    gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, size, gl.FLOAT, false, 0, 0);
  }
  attr('a_pos', pos, 3); attr('a_seed', seed, 4);

  var U = {};
  ['u_t', 'u_mouse', 'u_mp', 'u_scale', 'u_dpr', 'u_zoom', 'u_pan', 'u_rot'].forEach(function (n) { U[n] = gl.getUniformLocation(prog, n); });
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.clearColor(0.008, 0.012, 0.035, 1);

  var W, H, dpr, scale = [1, 1];
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    var a = W / H, f = 0.86;                            // 회전해도 화면 안에 들어오는 여유
    scale = a >= 1 ? [f / a, f] : [f, f * a];
  }
  addEventListener('resize', resize); resize();

  // ---- 회전(3x3, column-major) ----
  var R = [1, 0, 0, 0, 1, 0, 0, 0, 1], vx = 0, vy = 0;
  function mul(A, B) {
    var C = new Array(9);
    for (var c = 0; c < 3; c++) for (var r = 0; r < 3; r++)
      C[c * 3 + r] = A[r] * B[c * 3] + A[3 + r] * B[c * 3 + 1] + A[6 + r] * B[c * 3 + 2];
    return C;
  }
  function rotate(ax, ay) {                             // ax: 상하 드래그, ay: 좌우 드래그 (rad)
    var cy = Math.cos(ay), sy = Math.sin(ay), cx = Math.cos(ax), sx = Math.sin(ax);
    R = mul([1, 0, 0, 0, cx, sx, 0, -sx, cx], mul([cy, 0, -sy, 0, 1, 0, sy, 0, cy], R));
  }

  // ---- 줌 / 팬 / 포인터 ----
  var zoom = 1, zoomT = 1, pan = [0, 0], anchor = [0, 0];
  var mouse = [0, 0], mTarget = [0, 0], strength = 0, want = 0;
  var pts = {}, lastMid = null, lastDist = 0, mode = 'rotate';
  function clampZ(z) { return Math.min(8, Math.max(0.5, z)); }
  function ndc(x, y) { return [x / W * 2 - 1, 1 - y / H * 2]; }
  function zoomBy(nz, m) {                              // 임의의 지점(m)을 고정한 채 배율 변경
    var ratio = nz / zoom;
    pan[0] = m[0] - (m[0] - pan[0]) * ratio; pan[1] = m[1] - (m[1] - pan[1]) * ratio;
    zoom = nz;
  }
  function count() { return Object.keys(pts).length; }
  function two() { var k = Object.keys(pts); return [pts[k[0]], pts[k[1]]]; }

  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  canvas.addEventListener('pointerdown', function (e) {
    canvas.setPointerCapture(e.pointerId);
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    want = 0; vx = vy = 0;
    mode = (e.button === 2 || e.button === 1 || e.shiftKey) ? 'pan' : 'rotate';
    if (count() === 2) { var p = two(); lastDist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); lastMid = [(p[0].x + p[1].x) / 2, (p[0].y + p[1].y) / 2]; }
  });
  canvas.addEventListener('pointermove', function (e) {
    var p = pts[e.pointerId];
    if (!p) { mTarget = ndc(e.clientX, e.clientY); want = 1; return; }   // 호버
    var dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (count() >= 2) {                                                   // 핀치: 두 손가락 중심 기준 확대 + 이동
      var q = two(), d = Math.hypot(q[0].x - q[1].x, q[0].y - q[1].y);
      var mx = (q[0].x + q[1].x) / 2, my = (q[0].y + q[1].y) / 2;
      if (lastDist > 0) { var nz = clampZ(zoom * d / lastDist); zoomBy(nz, ndc(mx, my)); zoomT = nz; }
      if (lastMid) { pan[0] += (mx - lastMid[0]) / W * 2; pan[1] -= (my - lastMid[1]) / H * 2; }
      lastDist = d; lastMid = [mx, my]; return;
    }
    if (mode === 'pan') { pan[0] += dx / W * 2; pan[1] -= dy / H * 2; return; }
    var k = 0.006 / Math.sqrt(zoom);
    rotate(dy * k, dx * k); vx = vx * 0.5 + dx * k * 0.5; vy = vy * 0.5 + dy * k * 0.5;
  });
  function up(e) {
    delete pts[e.pointerId]; lastDist = 0; lastMid = null;
    if (e.pointerType !== 'mouse') want = 0;
  }
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse' && !pts[e.pointerId]) want = 0; });
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    zoomT = clampZ(zoomT * Math.exp(-e.deltaY * 0.0015)); anchor = ndc(e.clientX, e.clientY);
  }, { passive: false });
  function reset() { zoomT = 1; anchor = [0, 0]; R = [1, 0, 0, 0, 1, 0, 0, 0, 1]; vx = vy = 0; pan = [0, 0]; }
  canvas.addEventListener('dblclick', reset);
  addEventListener('keydown', function (e) {
    if (e.key === '+' || e.key === '=') { zoomT = clampZ(zoomT * 1.2); anchor = [0, 0]; }
    else if (e.key === '-' || e.key === '_') { zoomT = clampZ(zoomT / 1.2); anchor = [0, 0]; }
    else if (e.key === '0') reset();
  });
  ['gesturestart', 'gesturechange'].forEach(function (n) { addEventListener(n, function (e) { e.preventDefault(); }); });

  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var last = performance.now(), t = 0;
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05); last = now;
    t += dt * (reduce ? 0.4 : 1);

    if (Math.abs(zoomT - zoom) > 1e-4) zoomBy(zoom + (zoomT - zoom) * (1 - Math.exp(-dt / 0.18)), anchor);
    if (count() === 0 && (Math.abs(vx) + Math.abs(vy)) > 1e-5) {          // 관성 회전
      rotate(vy * dt * 60, vx * dt * 60);
      var dec = Math.exp(-dt / 0.9); vx *= dec; vy *= dec;
    }
    var k = 1 - Math.exp(-dt / 1.6);                                      // 느린 포인터 추적
    mouse[0] += (mTarget[0] - mouse[0]) * k; mouse[1] += (mTarget[1] - mouse[1]) * k;
    strength += (want - strength) * (1 - Math.exp(-dt / 2.2));

    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(U.u_t, t);
    gl.uniform2f(U.u_mouse, mouse[0], mouse[1]);
    gl.uniform1f(U.u_mp, strength);
    gl.uniform2f(U.u_scale, scale[0], scale[1]);
    gl.uniform1f(U.u_dpr, dpr);
    gl.uniform1f(U.u_zoom, zoom);
    gl.uniform2f(U.u_pan, pan[0], pan[1]);
    gl.uniformMatrix3fv(U.u_rot, false, new Float32Array(R));
    gl.drawArrays(gl.POINTS, 0, N);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
